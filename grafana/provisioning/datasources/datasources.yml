apiVersion: 1

datasources:
  - name: CloudWatch
    type: cloudwatch
    access: proxy
    jsonData:
      authType: default
      defaultRegion: us-east-1
    editable: true

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.golden-bears.local:9090
    jsonData:
      httpMethod: POST
    editable: true
