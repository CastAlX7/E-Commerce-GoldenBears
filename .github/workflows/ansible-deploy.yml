name: Ansible — Deploy to ECS

# Sigue el patrón de la guía (Sección 6.5): Ansible corre encadenado por
# workflow_run después de que la imagen del backend ya está en ECR (si no,
# no habría nada nuevo que desplegar), o de forma manual con
# workflow_dispatch. La guía usa SSM sobre instancias EC2; acá no aplica
# (el compute es ECS Fargate, no hay instancia donde "entrar"), así que
# Ansible arma la Task Definition y llama a la API de ECS directo.
on:
  workflow_run:
    workflows: ["Build y Push a ECR + Frontend"]
    types: [completed]
    branches: [develop, qa, main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID del run de 'Build y Push a ECR + Frontend' del que descargar tf-outputs (número al final de su URL en Actions)"
        required: true

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

# Evita que 2 corridas del mismo entorno se pisen (ej. un re-run manual
# mientras la automática por workflow_run sigue corriendo) desplegando 2
# task definitions distintas a la vez sobre el mismo servicio ECS.
concurrency:
  group: ansible-deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:

  resolve-environment:
    name: Resolver entorno según la rama
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      workspace: ${{ steps.resolve.outputs.workspace }}
      sha:       ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Mapear rama -> workspace
        id: resolve
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          case "$BRANCH" in
            develop) echo "workspace=dev" >> "$GITHUB_OUTPUT" ;;
            qa)      echo "workspace=qa" >> "$GITHUB_OUTPUT" ;;
            main)    echo "workspace=prod" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Rama sin entorno asociado: $BRANCH"
              exit 1
              ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # JOB: Ansible arma la Task Definition nueva
  #      (imagen + env + secrets) y actualiza el
  #      servicio ECS. Lee los outputs de Terraform
  #      desde el artifact re-publicado por
  #      ecr-build.yml (nunca corre `terraform
  #      output` él mismo).
  # ─────────────────────────────────────────────
  deploy-ecs:
    name: Ansible — Deploy to ECS
    runs-on: ubuntu-latest
    needs: resolve-environment
    environment: ${{ needs.resolve-environment.outputs.workspace }}
    steps:
      - name: Checkout del código (commit exacto que disparó el pipeline)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-environment.outputs.sha }}

      - name: Descargar outputs de Terraform (del run que disparó este workflow)
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-skip-session-tagging: true
          aws-region:     ${{ env.AWS_REGION }}

      - name: Instalar Ansible
        run: pip install ansible

      - name: Ejecutar playbook de despliegue ECS
        run: |
          ansible-playbook -i "ansible/inventory/${{ needs.resolve-environment.outputs.workspace }}.yml" \
            ansible/playbooks/deploy_ecs.yml \
            -e "image_tag=${{ needs.resolve-environment.outputs.sha }}" \
            -e "tf_outputs_file=${{ github.workspace }}/tf-outputs.json"
