name: CD — Push to ECR & Deploy to ECS

on:
  push:
    branches: [main, "fix/cleanup-iac-code"]

env:
  AWS_REGION: us-east-1

jobs:

  push-backend:
    name: Push Backend — FastAPI/Python a ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}
      - name: Login a Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build y Push a ECR
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/goldenbears-backend-prod:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/goldenbears-backend-prod:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  push-frontend:
    name: Push Frontend — React/Nginx a ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}
      - name: Login a Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build y Push a ECR
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/goldenbears-frontend-prod:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/goldenbears-frontend-prod:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-ecs:
    name: Ansible — Deploy to ECS
    runs-on: ubuntu-latest
    needs: [push-backend, push-frontend]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}
      - name: Instalar Python y Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip
          pip install ansible boto3 botocore
      - name: Ejecutar playbook de despliegue
        run: |
          ansible-playbook ansible/playbooks/deploy_ecs.yml \
            -e "workspace=prod" \
            -e "project_name=goldenbears" \
            -e "aws_region=${{ env.AWS_REGION }}" \
            -e "image_tag=${{ github.sha }}"
        env:
          REDIS_AUTH_TOKEN: ${{ secrets.REDIS_AUTH_TOKEN }}