name: SonarCloud Analysis

on:
  push:
    branches: [ sonarqube ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=organizacioniac
            -Dsonar.projectKey=CastAlX7_E-Commerce-GoldenBears
            -Dsonar.sources=backend,frontend,iac,ansible
            -Dsonar.exclusions=**/.terraform/**,**/*.tfstate,**/*.tfstate.backup,**/*.tfplan,**/placeholder.zip
            -Dsonar.terraform.provider.aws.version=5.0.0
