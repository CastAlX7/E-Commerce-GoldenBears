name: CI — Lint, Validate & Build

on:
  push:
    branches: [main, develop, "fix/cleanup-iac-code"]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: us-east-1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint-terraform:
    name: Terraform Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.0.11"
      - name: Terraform fmt (verifica formato)
        run: terraform fmt -check -recursive
        working-directory: iac
      - name: Terraform init (sin backend remoto)
        run: terraform init -backend=false
        working-directory: iac
      - name: Terraform validate (valida sintaxis)
        run: terraform validate
        working-directory: iac
      - name: Checkov — Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: iac
          config_file: iac/.checkov.yaml
          output_format: cli
          soft_fail: true

  build-backend:
    name: Build Backend — FastAPI/Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build imagen — backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: goldenbears-backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build Frontend — React/Vite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build imagen — frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: false
          tags: goldenbears-frontend:ci-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend