---
- name: Build y push de imágenes Docker a ECR + empaquetar Lambdas
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Obtener account ID de AWS
      command: aws sts get-caller-identity --query Account --output text
      register: account_id_result

    - name: Login a ECR
      command: >
        aws ecr get-login-password --region {{ aws_region }} |
        docker login --username AWS --password-stdin
        {{ account_id_result.stdout }}.dkr.ecr.{{ aws_region }}.amazonaws.com

    - name: Build imagen backend
      command: docker build -t {{ project_name }}-backend:{{ workspace }} ../../backend

    - name: Tag imagen backend para ECR
      command: >
        docker tag {{ project_name }}-backend:{{ workspace }}
        {{ account_id_result.stdout }}.dkr.ecr.{{ aws_region }}.amazonaws.com/{{ project_name }}-backend:{{ workspace }}

    - name: Push imagen backend a ECR
      command: >
        docker push
        {{ account_id_result.stdout }}.dkr.ecr.{{ aws_region }}.amazonaws.com/{{ project_name }}-backend:{{ workspace }}

    - name: Build imagen frontend
      command: docker build -t {{ project_name }}-frontend:{{ workspace }} ../../frontend

    - name: Tag imagen frontend para ECR
      command: >
        docker tag {{ project_name }}-frontend:{{ workspace }}
        {{ account_id_result.stdout }}.dkr.ecr.{{ aws_region }}.amazonaws.com/{{ project_name }}-frontend:{{ workspace }}

    - name: Push imagen frontend a ECR
      command: >
        docker push
        {{ account_id_result.stdout }}.dkr.ecr.{{ aws_region }}.amazonaws.com/{{ project_name }}-frontend:{{ workspace }}

    - name: Empaquetar Lambda inventario
      community.general.archive:
        path: ../../backend/lambdas/inventario/
        dest: ../../iac/lambda_inventario.zip
        format: zip

    - name: Empaquetar Lambda comprobantes
      community.general.archive:
        path: ../../backend/lambdas/comprobantes/
        dest: ../../iac/lambda_comprobantes.zip
        format: zip