---
# Rota el valor de un secret ya existente en Secrets Manager, sin pasar
# por un terraform apply completo.
#
# Uso:
#   ansible-playbook playbooks/rotate_secret.yml \
#     -e "workspace=dev" \
#     -e "secret_name=cache/redis-token" \
#     -e 'secret_json={"auth_token":"nuevo-token"}'
#
# secret_name es la parte después de "<project_name>/<workspace>/", por
# ejemplo: cache/redis-token, notifications/gmail, billing/nubefact
- name: Rotar un valor en Secrets Manager
  hosts: localhost
  gather_facts: false
  vars:
    workspace: dev
  tasks:
    - name: Validar que se pasaron los parámetros requeridos
      fail:
        msg: "Hace falta -e secret_name=... -e secret_json='{...}'"
      when: secret_name is not defined or secret_json is not defined

    - name: Actualizar el valor del secret
      command: >
        aws secretsmanager put-secret-value
        --secret-id "{{ project_name }}/{{ workspace }}/{{ secret_name }}"
        --secret-string '{{ secret_json }}'
        --region {{ aws_region }}
      register: rotate_result

    - name: Confirmación
      debug:
        msg: "Secret {{ project_name }}/{{ workspace }}/{{ secret_name }} actualizado (versión {{ (rotate_result.stdout | from_json).VersionId }})"
