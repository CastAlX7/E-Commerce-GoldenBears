---
- name: Poblar AWS Secrets Manager con valores reales
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Actualizar secret nubefact_credentials
      community.aws.aws_secret:
        name: "golden-bears-nubefact-credentials-{{ workspace }}"
        region: "{{ aws_region }}"
        secret: "{{ nubefact_secret | to_json }}"
      vars:
        nubefact_secret:
          nubefact_token: "{{ lookup('env', 'NUBEFACT_TOKEN') }}"
          nubefact_url: "https://api.nubefact.com/v1/each"

    - name: Actualizar secret redis_credentials
      community.aws.aws_secret:
        name: "golden-bears-redis-credentials-{{ workspace }}"
        region: "{{ aws_region }}"
        secret: "{{ redis_secret | to_json }}"
      vars:
        redis_secret:
          redis_auth_token: "{{ lookup('env', 'REDIS_AUTH_TOKEN') }}"