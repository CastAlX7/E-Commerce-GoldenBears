- name: Obtener secret de DB desde AWS Secrets Manager
  community.aws.aws_secret:
    name: "{{ project_name }}-app-db-credentials-{{ workspace }}"
    region: "{{ aws_region }}"
  register: db_secret

- name: Obtener secret de Gmail desde AWS Secrets Manager
  community.aws.aws_secret:
    name: "{{ project_name }}-app-gmail-{{ workspace }}"
    region: "{{ aws_region }}"
  register: gmail_secret

- name: Generar backend/.env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ playbook_dir }}/../../backend/.env"
    mode: '0600'