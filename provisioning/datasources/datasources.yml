apiVersion: 1

datasources:
  - name: CloudWatch
    type: cloudwatch
    access: proxy
    jsonData:
      authType: default
      defaultRegion: us-east-1
      assumeRoleArn: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/grafana-cloudwatch-readonly"
    editable: true

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    jsonData:
      httpMethod: POST
    editable: true
